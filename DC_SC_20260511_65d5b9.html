<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>外贸订舱委托书系统 | 历史记录 · 专业中英文模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 30px 24px;
            color: #1e2a3a;
        }

        .app-container {
            max-width: 1500px;
            margin: 0 auto;
        }

        .flex-panel {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .form-section {
            flex: 1.2;
            min-width: 400px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            padding: 24px 28px;
        }

        .preview-section {
            flex: 1.5;
            min-width: 520px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            padding: 20px 24px;
            border: 1px solid #e2edf2;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 700;
            border-left: 5px solid #0a58ca;
            padding-left: 16px;
            margin-bottom: 20px;
            color: #0b2b3d;
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 20px 0 12px 0;
            color: #2c3e4e;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2c3e4e;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: 0.2s;
            background: #fff;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.2);
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        button.btn-outline {
            background: white;
            border: 1px solid #0d6efd;
            color: #0d6efd;
        }

        button.btn-outline:hover {
            background: #e7f1ff;
        }

        button.btn-sm {
            padding: 5px 14px;
            font-size: 0.75rem;
        }

        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #bb2d3b;
        }
        .storage-group {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 22px;
            border: 1px solid #e9edf2;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .tag-select {
            background: white;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.1s;
        }
        .tag-select:hover {
            background: #e2eafc;
            border-color: #0a58ca;
        }

        .product-item {
            background: #f9fbfd;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #e2edf2;
        }
        .product-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .global-unit-bar {
            background: #eef3fc;
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            border: 1px solid #cde1f0;
        }
        .unit-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 5px 14px;
            border-radius: 40px;
        }

        /* 统一的表格样式 - 屏幕与打印共享 */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0px;
            font-size: 0.85rem;
            table-layout: fixed;
        }
        .preview-table td, .preview-table th {
            border: 1px solid #9aaebf;
            padding: 8px 10px;
            vertical-align: top;
        }
        .preview-table td:first-child {
            width: 180px;
            background: #f4f7fb;
            font-weight: 700;
        }
        /* 标题行特殊样式 */
        .title-row td {
            background: #eef3fc;
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;
            font-family: 'Segoe UI', 'Microsoft YaHei', '黑体', 'Helvetica Neue', sans-serif;
            letter-spacing: 1px;
        }
        .goods-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0px;
            font-size: 0.8rem;
            table-layout: fixed;
        }
        .goods-table th, .goods-table td {
            border: 1px solid #8a99aa;
            padding: 8px 8px;
            text-align: left;
            vertical-align: top;
        }
        .goods-table th {
            background: #e9ecef;
            font-weight: 700;
        }
        /* 设置货物明细列宽比例，避免空白 */
        .goods-table th:nth-child(1), .goods-table td:nth-child(1) { width: 40%; }
        .goods-table th:nth-child(2), .goods-table td:nth-child(2) { width: 20%; }
        .goods-table th:nth-child(3), .goods-table td:nth-child(3) { width: 20%; }
        .goods-table th:nth-child(4), .goods-table td:nth-child(4) { width: 20%; }

        .signature-bar {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-top: 24px;
            border-top: 1px dashed #6c757d;
            padding-top: 18px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 20px;
        }
        .signature-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .signature-right {
            flex: 1;
            border-left: 1px dashed #bdc4cc;
            padding-left: 20px;
            min-width: 220px;
        }
        .contact-info {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .signature-line {
            margin-top: 16px;
            padding-top: 8px;
            border-top: 1px dotted #adb5bd;
        }
        .signature-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .signature-field-item {
            flex: 1;
            text-align: center;
        }
        .signature-field-item .line {
            border-bottom: 1px solid #6c757d;
            min-width: 120px;
            margin-top: 6px;
            height: 28px;
        }
        .stamp-area {
            margin-top: 8px;
            padding: 12px 16px;
            border: 1px dashed #dc3545;
            border-radius: 16px;
            background: #fff9f0;
            width: 100%;
            text-align: center;
        }
        .stamp-placeholder {
            font-size: 0.75rem;
            color: #b02a37;
            letter-spacing: 1px;
        }
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #dee2e6;
        }
        .btn-print {
            background: #28a745;
        }
        .btn-print:hover {
            background: #218838;
        }
        .history-section {
            margin-top: 24px;
            border-top: 2px solid #dee2e6;
            padding-top: 16px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover {
            background: #e7f1ff;
        }
        .history-date {
            font-weight: 600;
            color: #0a58ca;
        }
        .history-preview {
            font-size: 0.75rem;
            color: #6c757d;
            flex: 1;
            margin-left: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-clear-history {
            background: #6c757d;
        }
        @media (max-width: 880px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width { grid-column: span 1; }
            .flex-panel { flex-direction: column; }
            .signature-right {
                border-left: none;
                padding-left: 0;
                margin-top: 12px;
            }
        }
        .conditional-field {
            transition: all 0.2s;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c6e9e;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .address-radio-group {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2edf2;
            padding: 12px;
            margin-top: 12px;
            max-height: 320px;
            overflow-y: auto;
        }
        .radio-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px dashed #e9ecef;
            cursor: pointer;
        }
        .radio-item:last-child {
            border-bottom: none;
        }
        .radio-item:hover {
            background: #f1f9ff;
        }
        .radio-item.selected {
            background: #e7f1ff;
            border-radius: 12px;
        }
        .radio-custom {
            margin-top: 2px;
        }
        .addr-preview {
            flex: 1;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #2c3e4e;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .badge-date {
            font-size: 0.7rem;
            color: #6c757d;
            margin-left: 8px;
        }
        .address-counter {
            font-size: 12px;
            color: #2c6e9e;
            background: #e9ecef;
            border-radius: 20px;
            padding: 4px 10px;
            display: inline-block;
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .booking-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fbfd;
            border-radius: 20px;
            border: 1px dashed #cbd5e1;
            min-height: 400px;
            color: #8ba0b0;
            font-size: 1rem;
            text-align: center;
            padding: 40px;
        }
        /* 打印样式 - 保留所有表格边框和布局，无空白 */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .form-section, .action-buttons, .toast-msg, .btn-print, #generatePreviewBtn, h2, h3, .storage-group, .global-unit-bar, #addProductBtn, .flex-row, .address-radio-group, .history-section {
                display: none !important;
            }
            .preview-section {
                box-shadow: none;
                padding: 0;
                margin: 0;
                width: 100%;
            }
            .preview-section h2, .preview-section .booking-placeholder {
                display: none;
            }
            #bookingPreview {
                margin: 0;
                padding: 0;
            }
            .preview-table, .goods-table {
                border: 1px solid #000 !important;
                width: 100% !important;
                table-layout: fixed !important;
            }
            .preview-table td, .preview-table th, .goods-table td, .goods-table th {
                border: 1px solid #000 !important;
            }
            .title-row td {
                font-size: 1.4rem !important;
                font-weight: 800 !important;
                font-family: '黑体', 'Microsoft YaHei', 'Segoe UI', sans-serif !important;
            }
            .goods-table th:nth-child(1), .goods-table td:nth-child(1) { width: 40% !important; }
            .goods-table th:nth-child(2), .goods-table td:nth-child(2) { width: 20% !important; }
            .goods-table th:nth-child(3), .goods-table td:nth-child(3) { width: 20% !important; }
            .goods-table th:nth-child(4), .goods-table td:nth-child(4) { width: 20% !important; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="flex-panel">
        <!-- 左侧表单区 -->
        <div class="form-section">
            <h2>📦 订舱委托 · 信息存储器</h2>
            
            <!-- 1. SHIPPER -->
            <div class="storage-group">
                <label style="font-weight:700;">🚢 Shipper (发货人)</label>
                <div class="flex-row">
                    <input type="text" id="shipperInput" style="flex:2;" placeholder="公司全称 + 地址 + 联系方式" value="SHANGHAI GLOBAL TRADE CO., LTD. 88 Innovation Road, Shanghai, China">
                    <button id="saveShipperBtn" class="btn-sm">💾 保存发货人</button>
                </div>
                <div class="flex-row" id="shipperListContainer"></div>
                <div style="font-size:11px; color:#6c757d; margin-top:5px;">点击已保存的发货人快速填充</div>
            </div>

            <!-- 2. Consignee & Notify Party 地址库 -->
            <div class="storage-group">
                <label style="font-weight:700;">📌 收货人/通知人地址库 (最多50个，单选调用)</label>
                <div class="flex-row" style="justify-content:space-between; flex-wrap: wrap;">
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button id="addAddressToBookBtn" class="btn-sm btn-success" style="background:#28a745;">➕ 添加地址</button>
                        <button id="saveAddressBtn" class="btn-sm" style="background:#0d6efd;">💾 保存地址</button>
                        <button id="resetAddressBookBtn" class="btn-sm btn-outline">🔄 重置地址库</button>
                    </div>
                    <span id="addressCountBadge" class="address-counter">0 / 50</span>
                </div>
                
                <div class="form-grid" style="margin-top: 14px;">
                    <div class="input-group"><label>Consignee (收货人)</label><textarea id="consigneeInput" rows="2" placeholder="公司全称、地址、联系方式">EURO IMPORT GMBH
Industriestr. 45, 20457 Hamburg, Germany
Attn: Michael Schmidt</textarea></div>
                    <div class="input-group"><label>Notify Party (通知人)</label><textarea id="notifyInput" rows="2" placeholder="通常同收货人或目的港代理">SAME AS CONSIGNEE
OR: HAMBURG LOGISTICS AG</textarea></div>
                </div>
                
                <div id="addressRadioList" class="address-radio-group">
                    <div style="color: #6c757d; padding: 12px; text-align: center;">暂无保存的地址，请先点击“添加地址”或“保存地址”</div>
                </div>
                <div class="flex-row" style="justify-content: space-between; margin-top: 8px;">
                    <button id="deleteSelectedAddressBtn" class="btn-sm btn-danger" style="background:#dc3545;">🗑️ 删除选中的地址</button>
                    <button id="applySelectedAddressBtn" class="btn-sm" style="background:#0d6efd;">✓ 应用选中的地址到表单</button>
                </div>
                <div style="font-size:11px; color:#6c757d; margin-top: 8px;">💡 提示：可逐个添加最多50组地址。</div>
            </div>

            <!-- 3. 航线 & 贸易条款 -->
            <h3>🚢 航线 & 贸易条款</h3>
            <div class="form-grid">
                <div class="input-group"><label>启运港 Port of Loading</label><input type="text" id="portOfLoading" placeholder="SHANGHAI, CHINA" value="SHANGHAI, CHINA"></div>
                <div class="input-group"><label>目的港 Port of Discharge</label><input type="text" id="portOfDischarge" placeholder="HAMBURG, GERMANY" value="HAMBURG, GERMANY"></div>
                <div class="input-group"><label>交货地 Final Destination</label><div style="display:flex; gap:6px;"><input type="text" id="finalDestination" style="flex:2;" placeholder="同目的港或内陆点" value="HAMBURG, GERMANY"><button id="copyShipperToDestBtn" class="btn-sm" style="background:#6c757d; white-space:nowrap;">📋 同发货人地址</button></div></div>
                <div class="input-group"><label>船名/航次 Vessel/Voyage</label><input type="text" id="vesselVoyage" placeholder="MSC TESSA / UX234W" value="MSC TESSA / UX234W"></div>
                <div class="input-group"><label>贸易条款 Trade Term</label><select id="tradeTerm"><option value="FOB">FOB</option><option value="CIF" selected>CIF</option><option value="CFR">CFR</option><option value="EXW">EXW</option><option value="FCA">FCA</option></select></div>
                <div class="input-group"><label>提单类型 B/L Type</label><select id="blType"><option value="正本提单 Original B/L" selected>正本提单 Original B/L</option><option value="电放提单 Telex Release">电放提单 Telex Release</option><option value="SWB Sea Waybill">SWB Sea Waybill</option></select></div>
                <div class="input-group"><label>正本提单份数 Original B/L Qty</label><select id="blCount"><option value="1">1份</option><option value="2">2份</option><option value="3" selected>3份</option><option value="0">电放/0份</option></select></div>
                <div class="input-group"><label>货好日期 Cargo Ready Date</label><input type="date" id="cargoReadyDate" value="2026-05-20"></div>
                <div class="input-group"><label>指定船公司(可选) Preferred Carrier</label><input type="text" id="preferredCarrier" placeholder="COSCO / MAERSK" value="MSC"></div>
            </div>

            <!-- 唛头 & 柜型柜量 -->
            <h3>🏷️ 唛头 & 柜型柜量</h3>
            <div class="form-grid">
                <div class="input-group full-width"><label>唛头 Marks & Nos</label><textarea id="marksNos" rows="2" placeholder="N/M 或 具体唛头信息">N/M</textarea></div>
                <div class="input-group full-width">
                    <label>柜型柜量 Container Type & Quantity</label>
                    <select id="containerInfoSelect">
                        <option value="1×20GP">1×20GP</option>
                        <option value="2×20GP">2×20GP</option>
                        <option value="1×40GP">1×40GP</option>
                        <option value="2×40GP">2×40GP</option>
                        <option value="1×40HQ" selected>1×40HQ</option>
                        <option value="2×40HQ">2×40HQ</option>
                        <option value="1×40FR">1×40FR (框架柜)</option>
                        <option value="1×45HQ">1×45HQ</option>
                        <option value="1×20RF">1×20RF (冷藏柜)</option>
                        <option value="1×40RH">1×40RH (冷藏高柜)</option>
                        <option value="其他 (手动填写)">其他 (手动填写)</option>
                    </select>
                    <input type="text" id="containerInfoManual" style="margin-top: 8px; display: none;" placeholder="请输入其他柜型柜量">
                </div>
            </div>

            <!-- 产品信息 -->
            <h3>📦 产品信息 (Product Details) 单位全局可选</h3>
            <div class="global-unit-bar">
                <span style="font-weight:600;">⚙️ 默认单位 (一键应用所有产品)</span>
                <div class="unit-option"><label>数量 Unit:</label><select id="globalQtyUnit"><option value="PCS">PCS</option><option value="CTN" selected>CTN</option><option value="SET">SET</option><option value="ROLL">ROLL</option><option value="CARTON">CARTON</option></select></div>
                <div class="unit-option"><label>毛重 GW Unit:</label><select id="globalGWUnit"><option value="KG" selected>KG</option><option value="LB">LB</option></select></div>
                <div class="unit-option"><label>体积 Volume Unit:</label><select id="globalVolUnit"><option value="CBM" selected>CBM</option><option value="CFT">CFT</option></select></div>
                <button id="applyGlobalUnitBtn" class="btn-sm" style="background:#0d6efd;">✅ 应用到所有产品</button>
            </div>
            <div id="productsContainer"></div>
            <button id="addProductBtn" style="background:#2c6e9e; margin-bottom:16px;">+ 添加产品</button>

            <!-- 委托联系 & 拖车安排 -->
            <h3>📞 委托联系 & 拖车安排</h3>
            <div class="form-grid">
                <div class="input-group full-width"><label>联络人及电话 Contact Person</label><input type="text" id="contactPerson" placeholder="张敏 / 13812345678" value="张敏 / 13812345678"></div>
                <div class="input-group full-width">
                    <label>Trucking Arrangement 拖车安排</label>
                    <select id="truckNeedSelect">
                        <option value="need">🚛 需安排拖车 Arrange truck</option>
                        <option value="none" selected>🚫 无需安排拖车 No truck needed</option>
                    </select>
                </div>
                <div id="loadingAddrWrapper" class="input-group full-width conditional-field" style="display:none;">
                    <label>装柜地址 Loading Address</label>
                    <input type="text" id="loadingAddress" placeholder="详细装货仓库地址">
                </div>
                <div class="input-group full-width"><label>特殊要求 Special Request</label><textarea id="specialReq" rows="2" placeholder="如：预配舱单、目的港免箱期等">AMS FILING DUE, 14 DAYS FREE TIME AT DESTINATION</textarea></div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button id="generatePreviewBtn" style="background:#0a58ca; padding: 10px 32px;">✨ 生成订舱委托模板 (中英文)</button>
            </div>
            <div style="margin-top: 10px; font-size:11px; color:#6c757d; text-align:center;">托运人章及电子确认将显示在正式单证中</div>

            <!-- 历史记录区域 -->
            <div class="history-section">
                <div class="history-header">
                    <h3 style="margin:0; border:none;">📜 历史记录 (按日期检索)</h3>
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="searchHistoryDate" style="width: 160px;">
                        <button id="searchHistoryBtn" class="btn-sm">🔍 搜索</button>
                        <button id="clearHistoryBtn" class="btn-sm btn-clear-history">🗑️ 清空历史</button>
                    </div>
                </div>
                <div id="historyList" class="history-list">
                    <div style="text-align:center; color:#6c757d; padding:16px;">暂无历史记录，生成模板后自动保存</div>
                </div>
            </div>
        </div>

        <!-- 右侧预览区 -->
        <div class="preview-section">
            <h2 style="text-align:center; border-left:none; margin-bottom:8px;">📄 订舱委托书 Booking Note</h2>
            <div id="bookingPreview" class="booking-placeholder">
                ⚡ 点击左侧「生成订舱委托模板」按钮，即刻生成专业中英文订舱单
            </div>
        </div>
    </div>
    <div id="toastMsg" class="toast-msg">提示信息</div>
</div>

<script>
    // 存储模块
    let shipperStorage = JSON.parse(localStorage.getItem('shipperList') || '[]');
    let addressBook = JSON.parse(localStorage.getItem('consigneeAddressBook') || '[]');
    let historyRecords = JSON.parse(localStorage.getItem('bookingHistory') || '[]');
    const MAX_ADDRESS = 50;
    let currentSelectedAddressIndex = -1;

    let products = [];
    let nextProductId = 1;

    function initDefaultProducts() {
        products = [
            { id: nextProductId++, name: 'LED Downlight HS:940511', qty: 200, qtyUnit: 'CTN', gw: 480, gwUnit: 'KG', volume: 2.8, volumeUnit: 'CBM' },
            { id: nextProductId++, name: 'Smart Controller HS:853710', qty: 80, qtyUnit: 'CTN', gw: 320, gwUnit: 'KG', volume: 1.2, volumeUnit: 'CBM' }
        ];
    }
    initDefaultProducts();

    function showToast(msg, duration = 1500) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, duration);
    }

    function updateAddressCountBadge() {
        const badge = document.getElementById('addressCountBadge');
        if(badge) badge.innerText = `${addressBook.length} / ${MAX_ADDRESS}`;
    }

    function renderShipperTags() {
        const container = document.getElementById('shipperListContainer');
        if(!container) return;
        if(shipperStorage.length === 0) { container.innerHTML = '<span style="font-size:12px;">暂无保存的发货人</span>'; return; }
        container.innerHTML = shipperStorage.map(sh => `<span class="tag-select" data-val="${escapeHtml(sh)}">🏢 ${sh.substring(0, 34)}${sh.length>34?'…':''}</span>`).join('');
        document.querySelectorAll('[data-val]').forEach(el => {
            el.addEventListener('click', (e) => { document.getElementById('shipperInput').value = el.getAttribute('data-val'); });
        });
    }

    function renderAddressRadioList() {
        const container = document.getElementById('addressRadioList');
        if(!container) return;
        if(addressBook.length === 0) {
            container.innerHTML = '<div style="color: #6c757d; padding: 12px; text-align: center;">暂无保存的地址</div>';
            updateAddressCountBadge();
            return;
        }
        container.innerHTML = addressBook.map((item, idx) => {
            const consPreview = (item.consigneeText || '').substring(0, 80);
            const notifyPreview = (item.notifyText || '').substring(0, 60);
            const isSelected = (currentSelectedAddressIndex === idx);
            return `
                <div class="radio-item ${isSelected ? 'selected' : ''}" data-idx="${idx}">
                    <div class="radio-custom">
                        <input type="radio" name="addressRadio" value="${idx}" ${isSelected ? 'checked' : ''}>
                    </div>
                    <div class="addr-preview">
                        <strong>收货人 ${idx+1}:</strong> ${escapeHtml(consPreview)}<br>
                        <strong>通知人:</strong> ${escapeHtml(notifyPreview)}
                    </div>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.radio-item').forEach(el => {
            const radioInput = el.querySelector('input[type="radio"]');
            const idx = parseInt(el.getAttribute('data-idx'));
            el.addEventListener('click', (e) => {
                if(radioInput) radioInput.checked = true;
                currentSelectedAddressIndex = idx;
                renderAddressRadioList();
            });
            if(radioInput) {
                radioInput.addEventListener('change', (e) => {
                    if(radioInput.checked) {
                        currentSelectedAddressIndex = idx;
                        renderAddressRadioList();
                    }
                });
            }
        });
        updateAddressCountBadge();
    }

    function saveCurrentAddressToBook() {
        let consigneeVal = document.getElementById('consigneeInput').value.trim();
        let notifyVal = document.getElementById('notifyInput').value.trim();
        if(!consigneeVal && !notifyVal) { showToast('请至少填写收货人或通知人内容'); return; }
        if(addressBook.length >= MAX_ADDRESS) { showToast(`地址库已达上限 ${MAX_ADDRESS} 个`, 2000); return; }
        addressBook.push({ consigneeText: consigneeVal, notifyText: notifyVal, timestamp: Date.now() });
        localStorage.setItem('consigneeAddressBook', JSON.stringify(addressBook));
        currentSelectedAddressIndex = addressBook.length - 1;
        renderAddressRadioList();
        showToast(`✓ 已保存地址 ${addressBook.length} / ${MAX_ADDRESS}`, 1200);
    }

    function resetAddressBook() {
        if(addressBook.length === 0) { showToast('地址库已空', 1000); return; }
        addressBook = [];
        localStorage.setItem('consigneeAddressBook', JSON.stringify(addressBook));
        currentSelectedAddressIndex = -1;
        renderAddressRadioList();
        showToast('地址库已重置', 1200);
    }

    function deleteSelectedAddress() {
        if(addressBook.length === 0 || currentSelectedAddressIndex === -1) { showToast('请先选中一个地址', 1200); return; }
        addressBook.splice(currentSelectedAddressIndex, 1);
        localStorage.setItem('consigneeAddressBook', JSON.stringify(addressBook));
        if(addressBook.length === 0) currentSelectedAddressIndex = -1;
        else currentSelectedAddressIndex = Math.min(currentSelectedAddressIndex, addressBook.length-1);
        renderAddressRadioList();
        showToast('已删除地址', 1200);
    }

    function applySelectedAddress() {
        if(addressBook.length === 0 || currentSelectedAddressIndex === -1) { showToast('请先选中一个地址', 1200); return; }
        const selected = addressBook[currentSelectedAddressIndex];
        if(selected) {
            document.getElementById('consigneeInput').value = selected.consigneeText || '';
            document.getElementById('notifyInput').value = selected.notifyText || '';
            showToast(`已应用收货人${currentSelectedAddressIndex+1}`, 1200);
        }
    }

    function copyShipperToDest() {
        const shipperAddr = document.getElementById('shipperInput').value.trim();
        if(!shipperAddr) { showToast('发货人地址为空', 1000); return; }
        document.getElementById('finalDestination').value = shipperAddr;
        showToast('已复制到交货地', 1000);
    }

    function saveShipper() {
        let sh = document.getElementById('shipperInput').value.trim();
        if(!sh) { showToast('请填写发货人全称'); return; }
        if(!shipperStorage.includes(sh)) { shipperStorage.push(sh); localStorage.setItem('shipperList', JSON.stringify(shipperStorage)); }
        else { showToast('发货人已存在'); return; }
        renderShipperTags();
        showToast('发货人已保存', 800);
    }

    function applyGlobalUnits() {
        const globalQty = document.getElementById('globalQtyUnit').value;
        const globalGW = document.getElementById('globalGWUnit').value;
        const globalVol = document.getElementById('globalVolUnit').value;
        products.forEach(p => { p.qtyUnit = globalQty; p.gwUnit = globalGW; p.volumeUnit = globalVol; });
        renderProducts();
        showToast(`单位已应用`, 1200);
    }

    function renderProducts() {
        const container = document.getElementById('productsContainer');
        if(!container) return;
        if(products.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:24px;">暂无产品，点击“添加产品”</div>';
            return;
        }
        container.innerHTML = products.map(prod => `
            <div class="product-item" data-pid="${prod.id}">
                <div class="product-header"><span>📦 品名</span><button class="btn-danger btn-sm del-prod" data-id="${prod.id}">删除</button></div>
                <div class="form-grid" style="gap:12px;">
                    <div class="input-group full-width"><label>品名/HS Code</label><input class="prod-name" value="${escapeHtml(prod.name)}" placeholder="Product name + HS code"></div>
                    <div class="input-group"><label>件数 Qty</label><input class="prod-qty" type="number" value="${prod.qty}"></div>
                    <div class="input-group"><label>单位 Unit</label><select class="prod-qty-unit"><option ${prod.qtyUnit==='PCS'?'selected':''}>PCS</option><option ${prod.qtyUnit==='CTN'?'selected':''}>CTN</option><option ${prod.qtyUnit==='SET'?'selected':''}>SET</option></select></div>
                    <div class="input-group"><label>毛重 GW</label><div style="display:flex; gap:5px;"><input class="prod-gw" type="number" step="0.1" value="${prod.gw}"><select class="prod-gw-unit"><option ${prod.gwUnit==='KG'?'selected':''}>KG</option><option ${prod.gwUnit==='LB'?'selected':''}>LB</option></select></div></div>
                    <div class="input-group"><label>体积 Volume</label><div style="display:flex; gap:5px;"><input class="prod-vol" type="number" step="0.01" value="${prod.volume}"><select class="prod-vol-unit"><option ${prod.volumeUnit==='CBM'?'selected':''}>CBM</option><option ${prod.volumeUnit==='CFT'?'selected':''}>CFT</option></select></div></div>
                </div>
            </div>
        `).join('');
        products.forEach(prod => {
            const el = document.querySelector(`.product-item[data-pid="${prod.id}"]`);
            if(!el) return;
            el.querySelector('.prod-name')?.addEventListener('input', (e) => prod.name = e.target.value);
            el.querySelector('.prod-qty')?.addEventListener('input', (e) => prod.qty = parseFloat(e.target.value) || 0);
            el.querySelector('.prod-qty-unit')?.addEventListener('change', (e) => prod.qtyUnit = e.target.value);
            el.querySelector('.prod-gw')?.addEventListener('input', (e) => prod.gw = parseFloat(e.target.value) || 0);
            el.querySelector('.prod-gw-unit')?.addEventListener('change', (e) => prod.gwUnit = e.target.value);
            el.querySelector('.prod-vol')?.addEventListener('input', (e) => prod.volume = parseFloat(e.target.value) || 0);
            el.querySelector('.prod-vol-unit')?.addEventListener('change', (e) => prod.volumeUnit = e.target.value);
        });
        document.querySelectorAll('.del-prod').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                products = products.filter(p => p.id !== id);
                renderProducts();
            });
        });
    }

    function addProduct() {
        products.push({ id: nextProductId++, name: '', qty: 0, qtyUnit: 'CTN', gw: 0, gwUnit: 'KG', volume: 0, volumeUnit: 'CBM' });
        renderProducts();
    }

    function truckToggle() {
        const select = document.getElementById('truckNeedSelect');
        const wrapper = document.getElementById('loadingAddrWrapper');
        wrapper.style.display = select.value === 'need' ? 'block' : 'none';
    }

    function initContainerType() {
        const select = document.getElementById('containerInfoSelect');
        const manual = document.getElementById('containerInfoManual');
        select.addEventListener('change', () => { manual.style.display = select.value === '其他 (手动填写)' ? 'block' : 'none'; });
    }

    function getContainerValue() {
        const select = document.getElementById('containerInfoSelect');
        const manual = document.getElementById('containerInfoManual');
        return select.value === '其他 (手动填写)' ? (manual.value.trim() || '待填写') : select.value;
    }

    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function saveToHistory(htmlContent) {
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 19).replace('T', ' ');
        const record = {
            id: Date.now(),
            date: dateStr,
            searchDate: now.toISOString().slice(0, 10),
            shipper: document.getElementById('shipperInput').value.trim().substring(0, 50),
            consignee: document.getElementById('consigneeInput').value.trim().substring(0, 50),
            pol: document.getElementById('portOfLoading').value.trim(),
            pod: document.getElementById('portOfDischarge').value.trim(),
            html: htmlContent
        };
        historyRecords.unshift(record);
        if(historyRecords.length > 100) historyRecords = historyRecords.slice(0, 100);
        localStorage.setItem('bookingHistory', JSON.stringify(historyRecords));
        renderHistoryList();
        showToast('单据已保存至历史记录', 1000);
    }

    function renderHistoryList(filterDate = '') {
        const container = document.getElementById('historyList');
        if(!container) return;
        let filtered = historyRecords;
        if(filterDate) filtered = historyRecords.filter(r => r.searchDate === filterDate);
        if(filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#6c757d; padding:16px;">暂无历史记录</div>';
            return;
        }
        container.innerHTML = filtered.map(record => `
            <div class="history-item" data-id="${record.id}">
                <span class="history-date">📅 ${record.date}</span>
                <span class="history-preview">${escapeHtml(record.shipper)} → ${escapeHtml(record.pod)}</span>
                <button class="btn-sm load-history" style="background:#0d6efd; padding:2px 10px;">加载</button>
            </div>
        `).join('');
        document.querySelectorAll('.load-history').forEach(btn => {
            const item = btn.closest('.history-item');
            const id = parseInt(item.getAttribute('data-id'));
            btn.addEventListener('click', () => loadHistoryRecord(id));
        });
    }

    function loadHistoryRecord(id) {
        const record = historyRecords.find(r => r.id === id);
        if(record && record.html) {
            const previewDiv = document.getElementById('bookingPreview');
            previewDiv.className = '';
            previewDiv.style.background = 'white';
            previewDiv.style.border = 'none';
            previewDiv.style.padding = '0';
            previewDiv.innerHTML = record.html + `
                <div class="action-buttons">
                    <button id="printPdfBtn" class="btn-print">🖨️ 打印 / 保存为PDF</button>
                </div>
            `;
            const printBtn = document.getElementById('printPdfBtn');
            if(printBtn) printBtn.addEventListener('click', () => printBooking(record.html));
            showToast('已加载历史单据', 1000);
        } else {
            showToast('加载失败', 1000);
        }
    }

    function clearHistory() {
        if(historyRecords.length === 0) { showToast('历史记录已空', 1000); return; }
        historyRecords = [];
        localStorage.setItem('bookingHistory', JSON.stringify(historyRecords));
        renderHistoryList();
        showToast('历史记录已清空', 1000);
    }

    function searchHistory() {
        const searchDate = document.getElementById('searchHistoryDate').value;
        renderHistoryList(searchDate);
        showToast(searchDate ? `已筛选 ${searchDate}` : '显示全部', 1000);
    }

    function printBooking(htmlContent) {
        let cleanHtml = htmlContent.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '');
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
                <head>
                    <title>订舱委托书</title>
                    <style>
                        * {
                            margin: 0;
                            padding: 0;
                            box-sizing: border-box;
                        }
                        body {
                            font-family: 'Segoe UI', 'Courier New', monospace;
                            padding: 20px;
                            margin: 0 auto;
                            width: 100%;
                        }
                        .preview-table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 0px;
                            font-size: 0.85rem;
                            table-layout: fixed;
                        }
                        .preview-table td, .preview-table th {
                            border: 1px solid #000;
                            padding: 8px 10px;
                            vertical-align: top;
                        }
                        .preview-table td:first-child {
                            width: 180px;
                            background: #f4f7fb;
                            font-weight: 700;
                        }
                        .title-row td {
                            background: #eef3fc;
                            text-align: center;
                            font-weight: 800;
                            font-size: 1.4rem;
                            font-family: '黑体', 'Microsoft YaHei', 'Segoe UI', sans-serif;
                            letter-spacing: 1px;
                        }
                        .goods-table {
                            width: 100%;
                            border-collapse: collapse;
                            margin: 0px;
                            font-size: 0.8rem;
                            table-layout: fixed;
                        }
                        .goods-table th, .goods-table td {
                            border: 1px solid #000;
                            padding: 8px 8px;
                            text-align: left;
                            vertical-align: top;
                        }
                        .goods-table th {
                            background: #e9ecef;
                            font-weight: 700;
                        }
                        .goods-table th:nth-child(1), .goods-table td:nth-child(1) { width: 40%; }
                        .goods-table th:nth-child(2), .goods-table td:nth-child(2) { width: 20%; }
                        .goods-table th:nth-child(3), .goods-table td:nth-child(3) { width: 20%; }
                        .goods-table th:nth-child(4), .goods-table td:nth-child(4) { width: 20%; }
                        .signature-bar {
                            display: flex;
                            justify-content: space-between;
                            margin-top: 24px;
                            border-top: 1px dashed #000;
                            padding-top: 18px;
                            font-size: 0.85rem;
                            flex-wrap: wrap;
                            gap: 20px;
                        }
                        .signature-left { flex: 1; }
                        .signature-right { flex: 1; padding-left: 20px; }
                        .stamp-area {
                            border: 1px dashed #dc3545;
                            padding: 12px;
                            text-align: center;
                        }
                        .line {
                            border-bottom: 1px solid #000;
                            min-width: 120px;
                            margin-top: 6px;
                            height: 28px;
                        }
                        .contact-info {
                            background: #f8f9fa;
                            padding: 8px 12px;
                            border-radius: 8px;
                        }
                        @media print {
                            body { margin: 0; padding: 0; }
                        }
                    </style>
                </head>
                <body>
                    ${cleanHtml}
                </body>
            </html>
        `);
        printWindow.document.close();
        printWindow.print();
    }

    function generateBookingTemplate() {
        const shipper = document.getElementById('shipperInput').value.trim() || '托运人待补充';
        const consignee = document.getElementById('consigneeInput').value.trim() || 'TO ORDER';
        const notify = document.getElementById('notifyInput').value.trim() || 'SAME';
        const pol = document.getElementById('portOfLoading').value.trim() || 'N/A';
        const pod = document.getElementById('portOfDischarge').value.trim() || 'N/A';
        const finalDest = document.getElementById('finalDestination').value.trim() || pod;
        const vessel = document.getElementById('vesselVoyage').value.trim() || 'TBN';
        const tradeTerm = document.getElementById('tradeTerm').value;
        const blType = document.getElementById('blType').value;
        const blCount = document.getElementById('blCount').value;
        const cargoReady = document.getElementById('cargoReadyDate').value || 'AS PER READY';
        const carrier = document.getElementById('preferredCarrier').value.trim();
        const marks = document.getElementById('marksNos').value.trim() || 'N/M';
        const containerInfo = getContainerValue();
        const contact = document.getElementById('contactPerson').value.trim() || '待补充';
        const truckNeed = document.getElementById('truckNeedSelect').value;
        let loadAddr = '';
        if(truckNeed === 'need') loadAddr = document.getElementById('loadingAddress').value.trim() || '待确认';
        const special = document.getElementById('specialReq').value.trim();
        const issueDate = new Date().toLocaleString('zh-CN');

        let productRows = '', totalQty = 0, totalGw = 0, totalVol = 0;
        products.forEach(p => {
            totalQty += p.qty; totalGw += p.gw; totalVol += p.volume;
            productRows += `<tr>
                <td>${escapeHtml(p.name)}</td>
                <td>${p.qty} ${p.qtyUnit}</td>
                <td>${p.gw.toFixed(2)} ${p.gwUnit}</td>
                <td>${p.volume.toFixed(3)} ${p.volumeUnit}</td>
            </tr>`;
        });
        if(!productRows) productRows = '<tr><td colspan="4" style="text-align:center;">暂无货物明细</td></tr>';

        const html = `
            <div>
                <table class="preview-table">
                    <tr class="title-row"><td colspan="2" style="text-align:center; font-weight:800; font-size:1.4rem; font-family:'黑体','Microsoft YaHei','Segoe UI',sans-serif;">📄 订舱委托书 / BOOKING NOTE</td></tr>
                    <tr><td>Shipper 托运人</td><td>${escapeHtml(shipper)}</td></tr>
                    <tr><td>Consignee 收货人</td><td>${escapeHtml(consignee)}</td></tr>
                    <tr><td>Notify Party 通知人</td><td>${escapeHtml(notify)}</td></tr>
                    <tr><td>Port of Loading 启运港</td><td>${escapeHtml(pol)}</td></tr>
                    <tr><td>Port of Discharge 目的港</td><td>${escapeHtml(pod)}</td></tr>
                    <tr><td>Final Destination 交货地</td><td>${escapeHtml(finalDest)}</td></tr>
                    <tr><td>Vessel / Voyage 船名航次</td><td>${escapeHtml(vessel)}</td></tr>
                    <tr><td>Marks & Nos 唛头</td><td>${escapeHtml(marks)}</td></tr>
                    <tr><td>Container Type & Qty 柜型柜量</td><td>${escapeHtml(containerInfo)}</td></tr>
                    <tr><td>Trade Term / B/L Info</td><td>${tradeTerm} | ${blType} | 正本份数: ${blCount}</td></tr>
                    <tr><td>Cargo Ready Date 货好日期</td><td>${escapeHtml(cargoReady)}</td></tr>
                    ${carrier ? `<tr><td>Preferred Carrier 指定船公司</td><td>${escapeHtml(carrier)}</td></tr>` : ''}
                    <tr><td>Trucking Arrangement 拖车安排</td><td>${truckNeed === 'need' ? '✅ 需安排拖车' : '⭕ 无需拖车'} ${loadAddr ? `(${escapeHtml(loadAddr)})` : ''}</td></tr>
                    ${special ? `<tr><td>Special Request 特殊要求</td><td>${escapeHtml(special)}</td></tr>` : ''}
                    <tr><td colspan="2" style="padding:0;"><table class="goods-table"><thead><tr><th>品名/HS Code</th><th>件数/单位</th><th>毛重</th><th>体积</th></tr></thead><tbody>${productRows}</tbody><tfoot><tr><td><strong>总计</strong></td><td><strong>${totalQty} PKGS</strong></td><td><strong>${totalGw.toFixed(2)}</strong></td><td><strong>${totalVol.toFixed(3)}</strong></td><tr></tfoot></table></td></tr>
                </table>
                <div class="signature-bar">
                    <div class="signature-left">
                        <div class="contact-info">📞 Contact Person 联络人: ${escapeHtml(contact)}</div>
                        <div class="signature-line"><div class="signature-field"><div class="signature-field-item"><div>委托人签字 / Signature</div><div class="line"></div></div><div class="signature-field-item"><div>日期 / Date</div><div class="line"></div></div></div></div>
                    </div>
                    <div class="signature-right">
                        <div style="font-weight:600;">🏢 Shipper's Chop 托运人盖章</div>
                        <div class="stamp-area"><div style="font-weight:bold;">COMPANY CHC</div><div class="stamp-placeholder">(盖章处 / Seal Here)</div><div style="height:30px;"></div><div>授权签字</div></div>
                    </div>
                </div>
                <div style="font-size:10px; text-align:center; margin-top:16px; border-top:1px solid #ccc; padding-top:8px;">单据出具日期: ${issueDate}</div>
            </div>
        `;
        
        const previewDiv = document.getElementById('bookingPreview');
        previewDiv.className = '';
        previewDiv.style.background = 'white';
        previewDiv.style.border = 'none';
        previewDiv.style.padding = '0';
        previewDiv.innerHTML = html + `<div class="action-buttons"><button id="printPdfBtn" class="btn-print">🖨️ 打印 / 保存为PDF</button></div>`;
        
        document.getElementById('printPdfBtn')?.addEventListener('click', () => printBooking(html));
        saveToHistory(html);
    }

    function init() {
        renderShipperTags();
        renderProducts();
        renderAddressRadioList();
        initContainerType();
        renderHistoryList();
        
        document.getElementById('saveShipperBtn').addEventListener('click', saveShipper);
        document.getElementById('addAddressToBookBtn').addEventListener('click', saveCurrentAddressToBook);
        document.getElementById('saveAddressBtn').addEventListener('click', saveCurrentAddressToBook);
        document.getElementById('resetAddressBookBtn').addEventListener('click', resetAddressBook);
        document.getElementById('deleteSelectedAddressBtn').addEventListener('click', deleteSelectedAddress);
        document.getElementById('applySelectedAddressBtn').addEventListener('click', applySelectedAddress);
        document.getElementById('copyShipperToDestBtn').addEventListener('click', copyShipperToDest);
        document.getElementById('addProductBtn').addEventListener('click', addProduct);
        document.getElementById('applyGlobalUnitBtn').addEventListener('click', applyGlobalUnits);
        document.getElementById('generatePreviewBtn').addEventListener('click', generateBookingTemplate);
        document.getElementById('truckNeedSelect').addEventListener('change', truckToggle);
        document.getElementById('searchHistoryBtn').addEventListener('click', searchHistory);
        document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
        truckToggle();
        setTimeout(() => generateBookingTemplate(), 200);
    }
    init();
</script>
